      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Brain/nodes icon -->
  <circle cx="38" cy="40" r="12" stroke="white" stroke-width="2.5" fill="none"/>
  <circle cx="62" cy="40" r="12" stroke="white" stroke-width="2.5" fill="none"/>
  <circle cx="50" cy="65" r="10" stroke="white" stroke-width="2.5" fill="none"/>
  <!-- Connecting lines -->
  <line x1="46" y1="50" x2="44" y2="56" stroke="white" stroke-width="2"/>
  <line x1="54" y1="50" x2="56" y2="56" stroke="white" stroke-width="2"/>
  <line x1="50" y1="46" x2="50" y2="46" stroke="white" stroke-width="2"/>
  <!-- AI sparkle -->
  <text x="50" y="42" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="system-ui">AI</text>
  <!-- Checkmark in bottom circle -->
