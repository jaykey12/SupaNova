services:
  - type: web
    name: kutane-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kutane-db
          property: connectionString
      - key: USE_DATABASE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SENDGRID_VERIFICATION_KEY
        sync: false
      - key: DASHBOARD_BASE_URL
        value: https://kutane-ai.vercel.app
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_EMAIL
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com

databases:
  - name: kutane-db
    databaseName: kutane
    plan: free
    postgresMajorVersion: 16/home/engine/.bashrc: line 1: syntax error near unexpected token `('
