services:
  - type: web
    name: novamind-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novamind-db
          property: connectionString
      - key: USE_DATABASE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SENDGRID_VERIFICATION_KEY
        sync: false
      - key: DASHBOARD_BASE_URL
        value: https://app.novamind.ai

databases:
  - name: novamind-db
    databaseName: novamind
    plan: free
    postgresMajorVersion: 16